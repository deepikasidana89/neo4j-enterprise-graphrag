[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo4j-enterprise-graphrag"
version = "0.1.0"
description = "Beginner-friendly enterprise GraphRAG reference implementation using Neo4j."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "neo4j>=6.3.1,<7",
]

[project.optional-dependencies]
dev = []

[project.scripts]
enterprise-graphrag = "enterprise_graphrag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
